name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff
        run: ruff check . --select E,F,I --ignore E501

  test:
    name: Unit Tests (CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}

      - name: Install CPU dependencies
        run: |
          pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install timm transformers scikit-learn numpy pytest faiss-cpu omegaconf rich

      - name: Run metric tests (no GPU required)
        run: pytest tests/test_metrics.py -v --tb=short

      - name: Run model smoke tests (CPU, random init)
        run: pytest tests/test_models.py -v --tb=short

  import-check:
    name: Import Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install timm transformers scikit-learn numpy faiss-cpu omegaconf rich fastapi uvicorn
      - name: Check all module imports
        run: |
          python -c "from models.face_recognition.arcface import ArcFaceModel, FaceDeduplicationIndex"
          python -c "from models.liveness.depth_liveness import DepthLivenessModel, LivenessLoss"
          python -c "from models.deepfake.cnn_transformer import DeepfakeDetector, DeepfakeLoss"
          python -c "from models.behavioral.au_gnn import ActionUnitGNN, GazeRegressionHead"
          python -c "from models.document.layout_intelligence import DocumentIntelligenceModel"
          python -c "from models.fusion.score_fusion import ScoreFusionModel, PlattCalibrator"
          python -c "from models.edge.distillation import SentinelEdgeModel, EdgeDistiller"
          python -c "from evaluation.metrics import compute_liveness_metrics, compute_verification_metrics"
          python -c "from explainability.gradcam import GradCAM, ScoreExplainer"
          python -c "from data.datasets import MSCelebDataset, FaceForensicsDataset, DISFADataset"
          echo "All imports OK"
