compute:
  num_workers: 2
  persistent_workers: false
  pin_memory: true
  prefetch_factor: 2
data:
  datasets:
  - name: document_train
    root: /content/data/documents
  image_size: 224
model:
  image_size: 224
paths:
  checkpoint_dir: /content/drive/MyDrive/sentinelid/checkpoints
project:
  compile_model: false
  device: cuda
  mixed_precision: true
  name: sentinelid-document
training:
  batch_size: 32
  epochs: 20
  eval_every_n_epochs: 5
  lr: 0.0001
  weight_decay: 0.0001
