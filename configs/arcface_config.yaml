compute:
  num_workers: 4
  persistent_workers: true
  pin_memory: true
data:
  datasets:
  - name: faces
    root: /content/data/faces
  image_size: 112
model:
  backbone: iresnet50
  embedding_dim: 512
  num_classes: 200
  pretrained: false
paths:
  checkpoint_dir: /content/drive/MyDrive/sentinelid/checkpoints
project:
  compile_model: false
  device: cuda
  mixed_precision: true
  name: sentinelid-face
training:
  batch_size: 64
  epochs: 30
  eval_every_n_epochs: 5
  lr: 0.001
  m: 0.5
  s: 64.0
  weight_decay: 0.0005
