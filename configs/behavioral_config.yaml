compute:
  num_workers: 2
  persistent_workers: false
  pin_memory: true
data:
  datasets:
  - name: behavioral_train
    root: /content/data/behavioral
model:
  hidden_dim: 256
  n_aus: 12
  n_heads: 4
  n_layers: 3
paths:
  checkpoint_dir: /content/drive/MyDrive/sentinelid/checkpoints
project:
  compile_model: false
  device: cuda
  mixed_precision: false
  name: sentinelid-behavioral
training:
  au_weight: 1.0
  batch_size: 256
  epochs: 20
  gaze_weight: 0.5
  lr: 0.001
  weight_decay: 0.0001
