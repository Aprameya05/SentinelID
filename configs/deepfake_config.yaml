compute:
  num_workers: 4
  persistent_workers: true
  pin_memory: true
data:
  datasets:
  - name: deepfake_train
    root: /content/data/deepfake
  image_size: 224
model:
  backbone: efficientnet_b4
  pretrained: true
paths:
  checkpoint_dir: /content/drive/MyDrive/sentinelid/checkpoints
project:
  compile_model: false
  device: cuda
  mixed_precision: true
  name: sentinelid-deepfake
training:
  batch_size: 32
  epochs: 20
  eval_every_n_epochs: 5
  focal_gamma: 2.0
  lr: 0.0005
  weight_decay: 0.0001
